# Native mkinitcpio configuration for the project's Ciri kernel.
# Run on Ciri (or inside its ARM64 rootfs with /boot mounted), not against
# the build host's kernel/modules. Use -k with the release matching Image-ciri.
# This is for an unencrypted ext4 root; root=UUID=... comes from GRUB, not FILES.

# Explicit inclusion prevents autodetect from dropping the touchscreen stack
# when rebuilding while the touchscreen is not bound/working. mkinitcpio
# includes module dependencies automatically; built-in drivers are also valid.
MODULES=(
    mmc_block mtk-sd
    xhci-mtk-hcd usb_storage nvme ext4
    usbhid cros_ec_keyb
    hid_himax i2c_hid_of hid_multitouch
)

BINARIES=()

# Himax firmware is explicitly included because firmware requests can be
# device/SKU-specific rather than discoverable from module firmware metadata.
# Keep all three variants, as in the original Ciri image builder.
FILES=(
    /usr/lib/firmware/himax_i2chid_1002.bin
    /usr/lib/firmware/himax_i2chid_1003.bin
    /usr/lib/firmware/himax_i2chid_1004.bin
    /usr/lib/firmware/mediatek/mt8188/scp-dual.img
)

HOOKS=(base udev autodetect modconf keyboard block filesystems fsck)
COMPRESSION="gzip"
